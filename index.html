<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLEACHHHH</title>

    <link href="https://fonts.googleapis.com/css2?family=Betania+Patmos&family=GDL&family=Lavishly+Yours&display=swap" rel="stylesheet">
    
    <link rel="icon" href="/images/Bleach_captains.jpg">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: rgb(255, 75, 75);
        }

        header {
            background-color: rgb(255, 187, 61);
            color: azure;
            padding: 30px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .top_header {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 30px;
        }

        .logo {
            height: 50px;
            width: auto;
            border-radius: 50px;
        }

        .top_header h1 {
            font-size: 28px;
            letter-spacing: 10px;
            margin: 0;
            color: azure;
            font-family: "Betania Patmos", cursive;
        }

        nav {
            font-size: 16px;
        }

        nav a {
            color: azure;
            text-decoration: none;
            margin: 0 10px;
        }

        nav a:hover {
            color: rgb(194, 59, 247);
            text-decoration: underline;
        }

        nav a:not(:last-child)::after {
            content: "|";
            margin-left: 10px;
        }

        .content-section {
            max-width: 800px;
            width: 100%;
            margin: 30px auto;
            background-color: rgba(179, 0, 0, 0.795);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 15px aquamarine;
        }

        .content-section h2 {
            text-align: center;
            color: rgb(41, 26, 26);
        }

        .content-section p {
            text-align: center;
            color: rgb(40, 59, 27);
            font-size: 16px;
            font-weight: bold;
        }

        .Gallary {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            padding: 10px;
        }

        .Gallary img {
            width: 240px;
            height: 160px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 8px rgb(36, 1, 44);
        }

        footer {
            background-color: brown;
            color: white;
            text-align: center;
            padding: 12px 20px;
        }

        footer p {
            margin: 0;
            font-size: 14px;
        }

        footer h2 {
            color: white;
            margin: 8px 5px;
        }

        .sicons a {
            text-decoration: none;
            font-size: 1.2rem;
            color: white;
            margin: 0 10px;
        }
    </style>
</head>
<body>

    <header>
        <div class="top_header">
            <img src="/images/bleachlogo.webp" alt="bleachh logo" class="logo">
            <h1>BLEACH</h1>
        </div>
        <nav>
            <a href="#">Home</a>
            <a href="#">Gallery</a>
            <a href="#">Contact Us</a>
            <a href="#">About Us</a>
        </nav>
    </header>

    <section class="content-section">
        <h2>Bleach</h2>
        <p>Bleach is fictional manga shonen which most famous shonen around the world</p>
    </section>

    <section class="content-section">
        <h2>Explore with photos</h2>
        <div class="Gallary">
            <img src="/images/Bleach_captains.jpg" alt="Captains of bleach">
            <img src="/images/b9.jpg" alt="main villain- yahwach">
            <img src="/images/b2.jpg" alt="aizen sosuke">
        </div>
    </section>

    <footer>
        <p> bleach categories:  explore anime and manga Animated television series about soul reapers</p>
        <h2>Connect With Us</h2>
        <div class="sicons">
            <a href="#"><i class="fa-brands fa-facebook"></i></a>
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-telegram"></i></a>
        </div>
    </footer>

</body>
</html>
